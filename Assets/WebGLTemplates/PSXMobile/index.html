<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{{ PRODUCT_NAME }}}</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      /* Stop the browser from hijacking drags as scroll/zoom gestures */
      touch-action: none; -ms-touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas {
      width: 100%; height: 100%; display: block; background: #000;
      touch-action: none;
    }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(#1a1030, #d4744a);
      color: #fff; text-align: center; padding: 24px;
    }
    #splash h1 {
      font-size: clamp(22px, 6vw, 40px); letter-spacing: .18em;
      margin: 0 0 6px; font-weight: 800; text-shadow: 2px 2px 0 #00000066;
    }
    #splash h2 {
      font-size: clamp(11px, 3vw, 15px); letter-spacing: .3em;
      margin: 0 0 34px; font-weight: 500; opacity: .85;
    }
    #bar {
      width: min(70vw, 340px); height: 12px; border: 2px solid #ffffffcc;
      background: #00000055; padding: 2px;
    }
    #bar > div { height: 100%; width: 0%; background: #ffd766; transition: width .15s; }
    #status { margin-top: 14px; font-size: 12px; letter-spacing: .12em; opacity: .9; }
    #play {
      margin-top: 26px; padding: 16px 44px; font-size: 17px; font-weight: 700;
      letter-spacing: .2em; color: #2a1408; background: #ffd766;
      border: none; cursor: pointer; display: none;
    }
    #play:active { transform: translateY(2px); }
    #hint {
      margin-top: 12px; font-size: 11px; letter-spacing: .18em;
      opacity: .75; display: none;
    }
    #rotate {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      background: #000; color: #fff; font-size: 15px; letter-spacing: .12em;
    }
    #rotate svg { margin-bottom: 18px; }
    /* Shown while the page does not have focus, which is the one state where
       the game is plainly running and yet ignoring every control. */
    #unfocused {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 15; display: none; pointer-events: none;
      padding: 9px 20px; border: 1px solid #ffffff55; border-radius: 3px;
      background: #000000c4; color: #ffd766;
      font-size: 12px; letter-spacing: .18em; white-space: nowrap;
    }
    /* Only nag about orientation on phone-sized screens */
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate.armed { display: flex; }
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="splash">
    <h1>{{{ PRODUCT_NAME }}}</h1>
    <h2>SUNSET CITY GP</h2>
    <div id="bar"><div id="fill"></div></div>
    <div id="status">LOADING&hellip;</div>
    <button id="play">START</button>
    <div id="hint">CLICK, TAP OR PRESS ENTER</div>
  </div>

  <div id="rotate">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
      <rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 19h6"/>
    </svg>
    <div>ROTATE TO LANDSCAPE</div>
  </div>

  <div id="unfocused">CLICK HERE TO RESUME CONTROL</div>

<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
// Everything below is scoped. A `var` at the top level of a classic script
// becomes a property of `window`, and `window` already owns some of these
// names — which is not a style point: `var status = ...` landed on
// `window.status`, a legacy SETTABLE STRING property, so the element was
// coerced to "[object HTMLDivElement]" and every `status.textContent = ...`
// after it was a silent no-op. The loading percentage never moved off
// "LOADING…", and neither did "FAILED: " + err — the one message that exists
// to say why nothing is happening.
(function () {
  var canvas = document.querySelector("#unity-canvas");
  var splash = document.querySelector("#splash");
  var fill = document.querySelector("#fill");
  var statusEl = document.querySelector("#status");
  var playBtn = document.querySelector("#play");
  var rotate = document.querySelector("#rotate");
  var unityInstance = null;
  var ready = false;      // player build finished loading
  var started = false;    // splash dismissed; start() is idempotent

  var config = {
    dataUrl: "Build/{{{ DATA_FILENAME }}}",
    frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
    codeUrl: "Build/{{{ CODE_FILENAME }}}",
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    matchWebGLToCanvasSize: true,
    devicePixelRatio: 1
  };

  // Render at CSS pixels, not retina pixels. The game is a 320x240 buffer
  // upscaled anyway, so a 3x device pixel ratio would cost fill rate for nothing.
  //
  // A WINDOW REPORTING NOTHING IS NOT A WINDOW OF SIZE ZERO. Minimising, an
  // occluded window, a background tab and a hidden embedded frame all fire
  // resize with innerWidth/innerHeight of 0, and this used to write that
  // straight through to the canvas. Unity follows the canvas
  // (matchWebGLToCanvasSize), so Screen.width becomes 0, every CanvasScaler
  // divides by it, and the UI is rebuilt at a scale factor with no meaning —
  // and it does NOT come back when the window does. Confirmed by hand on the
  // live build: force the canvas to 0x0 for a second and restore it, and the
  // menu stays enormous and blurred with no working controls for the rest of
  // the session. Keeping the last good size costs nothing, because a window
  // nobody can see does not need to be the right size.
  // Tested for being a POSITIVE FINITE NUMBER rather than for being >= 1,
  // because NaN fails every comparison including "< 1" and would sail through
  // a one-sided guard — and assigning NaN to canvas.width does not throw, it
  // silently sets zero, which is the exact state this is here to prevent.
  function usable(v) { return typeof v === "number" && isFinite(v) && v >= 1; }
  function resize() {
    var w = Math.floor(window.innerWidth);
    var h = Math.floor(window.innerHeight);
    if (!usable(w) || !usable(h)) return;
    canvas.width = w;
    canvas.height = h;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });
  // Coming back into view is the moment the real size is knowable again, and
  // the resize that arrives with it often still reports the old figures.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") setTimeout(resize, 0);
  });
  resize();

  // Block pinch-zoom and double-tap-zoom so driving gestures stay in the canvas
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  createUnityInstance(canvas, config, function (p) {
    fill.style.width = (p * 100) + "%";
    statusEl.textContent = "LOADING " + Math.round(p * 100) + "%";
  }).then(function (inst) {
    unityInstance = inst;
    statusEl.textContent = "READY";
    playBtn.style.display = "block";
    document.querySelector("#hint").style.display = "block";
    rotate.classList.add("armed");
    ready = true;
    // So Enter/Space land on the button without the player having to click it
    // first -- which is the whole point: a keydown grants the user activation
    // that fullscreen and the audio context need, and a GAMEPAD press does not.
    // Browsers only count click / tap / keydown as a gesture, so a player on a
    // pad still has to touch a key or the mouse exactly once to get in.
    try { playBtn.focus(); } catch (e) {}
  }).catch(function (err) {
    statusEl.textContent = "FAILED: " + err;
  });

  document.addEventListener("keydown", function (e) {
    if (!ready || started) return;
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      start();
    }
  });

  // The whole splash is a target, not just the 44-pixel button: a mistimed tap
  // on a phone otherwise looks like the game failing to start.
  splash.addEventListener("click", function () { if (ready) start(); });

  playBtn.addEventListener("click", function (e) { e.stopPropagation(); start(); });

  function start() {
    if (started) return;
    started = true;
    splash.style.display = "none";
    // Browsers only allow fullscreen and audio from inside a user gesture.
    var el = document.documentElement;
    var rq = el.requestFullscreen || el.webkitRequestFullscreen;
    // Both of these reject rather than throw when the browser declines (iOS
    // Safari has no element fullscreen, and orientation lock needs fullscreen
    // first). An unhandled rejection would surface as a page error.
    if (rq) {
      try { var p = rq.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    if (screen.orientation && screen.orientation.lock) {
      try {
        var q = screen.orientation.lock("landscape");
        if (q && q.catch) q.catch(function () {});
      } catch (e) {}
    }
    canvas.focus();
    resize();
    focusState();
  }

  // KEEP THE KEYBOARD POINTED AT THE GAME.
  //
  // Unity's WebGL input listens on the canvas, so anything that takes focus off
  // it — clicking the page margin, a browser overlay, alt-tabbing away and back,
  // leaving fullscreen with Escape — stops the keyboard reaching the game while
  // the pad, which the browser routes by page rather than by element, carries on
  // working. It reads as the controls dropping out at random.
  //
  // Handing focus back on the first click or key is not the same as stealing it:
  // there is nothing else on this page to type into once the splash is gone.
  function refocus() {
    if (!started) return;
    if (document.activeElement !== canvas) { try { canvas.focus(); } catch (e) {} }
  }

  // AND SAY SO WHEN IT CANNOT BE FIXED FROM HERE.
  //
  // An UNFOCUSED DOCUMENT kills the pad as well as the keyboard, and that is
  // not a Unity quirk — the Gamepad API only reports to a focused document, so
  // Chrome freezes every axis and button at rest. The game itself carries on:
  // requestAnimationFrame still runs while the window is merely unfocused, so
  // the car keeps rolling and answers nothing, which is precisely the state
  // this was reported in. Nothing in the page can take focus back, because
  // giving focus to a window is the user's to do — so the least it can do is
  // stop the failure being silent and name the one action that fixes it.
  // AND STOP THE GAME WHILE IT LASTS.
  //
  // Saying so at the bottom of the screen is not enough on its own: a notice
  // you read after losing a race is a post-mortem. The build carries a
  // FocusGuard on a DontDestroyOnLoad object called PSXFocus that holds the
  // clock until focus comes back, and this is the reliable way to tell it —
  // Unity's own OnApplicationFocus fires too, so both paths are idempotent by
  // design. Wrapped because SendMessage throws if the object is not in the
  // scene yet, which is every frame before the first world loads.
  var unfocused = document.querySelector("#unfocused");
  function tellUnity(live) {
    if (!unityInstance || !started) return;
    try { unityInstance.SendMessage("PSXFocus", "SetFocus", live ? 1 : 0); } catch (e) {}
  }
  function focusState() {
    if (!started) { unfocused.style.display = "none"; return; }
    var live = document.hasFocus() && document.visibilityState === "visible";
    unfocused.style.display = live ? "none" : "block";
    tellUnity(live);
    if (live) refocus();
  }
  window.addEventListener("focus", focusState);
  window.addEventListener("blur", focusState);
  document.addEventListener("visibilitychange", function () { setTimeout(focusState, 0); });
  document.addEventListener("fullscreenchange", function () { setTimeout(refocus, 0); });
  document.addEventListener("pointerdown", refocus, true);
})();
</script>
</body>
</html>
